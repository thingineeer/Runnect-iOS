<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runnect - 코스 공유</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F5F5F5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 400px;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: #593EEC;
      border-radius: 20px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      font-weight: bold;
    }
    h1 {
      font-size: 22px;
      color: #1A1A1A;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      color: #666;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #593EEC;
      color: white;
      text-decoration: none;
      padding: 14px 48px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">R</div>
    <h1>Runnect</h1>
    <p>공유된 코스를 확인하려면<br>Runnect 앱을 열어주세요.</p>
    <a class="btn" id="storeLink" href="https://apps.apple.com/app/id1663884202">앱 설치하기</a>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js';
    import { getAnalytics, logEvent } from 'https://www.gstatic.com/firebasejs/11.4.0/firebase-analytics.js';

    var firebaseConfig = {
      apiKey: "AIzaSyAfIcPe-mskJm9cxgtjcWPixe2I_8VsQOM",
      authDomain: "runnect-ios.firebaseapp.com",
      projectId: "runnect-ios",
      storageBucket: "runnect-ios.firebasestorage.app",
      messagingSenderId: "17552101098",
      appId: "1:17552101098:web:fa6862e3997979e3c0d193",
      measurementId: "G-E3BLH86DK5"
    };

    var app = initializeApp(firebaseConfig);
    var analytics = getAnalytics(app);

    var params = new URLSearchParams(window.location.search);
    var courseId = params.get('courseId');
    var privateCourseId = params.get('privateCourseId');
    var courseType = courseId ? 'public' : (privateCourseId ? 'private' : 'unknown');
    var id = courseId || privateCourseId || 'none';

    logEvent(analytics, 'share_link_visit', {
      course_type: courseType,
      course_id: id,
      referrer: document.referrer || 'direct'
    });

    var btn = document.getElementById('storeLink');

    if (courseId || privateCourseId) {
      btn.textContent = '앱에서 열기';
    }

    btn.addEventListener('click', function() {
      logEvent(analytics, 'share_link_click', {
        course_type: courseType,
        course_id: id,
        action: 'open_store'
      });
    });
  </script>
</body>
</html>
